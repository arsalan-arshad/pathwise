name: publish

# Publishes @arsalandev/pathwise to npm when a GitHub Release is published.
# One-time setup (by the repo owner, never by Claude): create an npm automation (granular, publish) token for the
# @arsalandev scope and save it as the repository secret NPM_TOKEN. Then: bump "version" in package.json, merge it,
# and create a GitHub Release whose tag is v<version> (for example v0.1.1).
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance (links the package to this repo and workflow run)

jobs:
  publish:
    if: github.repository == 'arsalan-arshad/pathwise'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Release tag must match package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "Release tag $TAG does not match package.json version v$version" >&2
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run demo
      - run: npm run build
      - run: npm run bench:prune
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
