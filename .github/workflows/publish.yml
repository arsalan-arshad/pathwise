name: Publish to GitHub Packages

# Publishes the package to GitHub Packages (npm registry) when a GitHub Release is published, or when someone runs
# the workflow by hand. The package on npmjs.com (@arsalandev/pathwise) is published separately, by hand, by the
# repository owner.
#
# GitHub Packages only accepts npm names scoped to the repository owner, so the name is changed to
# @arsalan-arshad/pathwise on the runner only; package.json in the repository keeps @arsalandev/pathwise.
# The built-in GITHUB_TOKEN is used: no personal access token and no repository secret is involved.
#
# How to release: bump "version" in package.json, merge it, then create a GitHub Release with the tag v<version>.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    # Forks cannot publish to this owner's registry.
    if: github.repository == 'arsalan-arshad/pathwise'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@arsalan-arshad'
      - run: npm ci
      - name: Release tag must match package.json version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "Release tag $TAG does not match package.json version v$version" >&2
            exit 1
          fi
      - name: Scope the package name for GitHub Packages (this runner only)
        run: npm pkg set name=@arsalan-arshad/pathwise
      # prepublishOnly runs the typecheck and the build before anything is uploaded.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
