<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      .banner-title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 42px; letter-spacing: -0.02em; fill: #0B1220; }
      .banner-tagline { font-family: 'Inter', -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #64748B; }
      .mono-label { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; fill: #64748B; }
      .mono-active { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; fill: #0D9488; }
    </style>
    <pattern id="grid-light" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#E2E8F0" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="#F7F8FA"/>
  <rect width="1280" height="320" fill="url(#grid-light)"/>

  <!-- Left Side: Brand & Tagline with 48px padding -->
  <g transform="translate(48, 96)">
    <!-- Small Mark inline -->
    <g transform="translate(0, 0) scale(0.12)">
      <circle cx="88" cy="256" r="32" fill="#0B1220"/>
      <path d="M 88 256 L 424 256" stroke="#0D9488" stroke-width="24"/>
      <circle cx="424" cy="256" r="44" stroke="#0D9488" stroke-width="16" fill="none"/>
      <circle cx="424" cy="256" r="20" fill="#0D9488"/>
      <path d="M 88 256 L 180 140 L 424 140" stroke="#CBD5E1" stroke-width="12"/>
      <path d="M 88 256 L 180 372 L 424 372" stroke="#CBD5E1" stroke-width="12"/>
    </g>
    <text x="68" y="44" class="banner-title">pathwise</text>
    <text x="2" y="88" class="banner-tagline">The cheapest path to the answer.</text>
  </g>

  <!-- Right Side: Graph shifted left, safe 48px padding on right, real plans only -->
  <g transform="translate(540, 48)">
    <!-- Branch 1: large · rerank · topK 10 -->
    <path d="M 20 112 L 100 32 L 240 32 L 350 32" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <circle cx="100" cy="32" r="4" fill="#CBD5E1"/>
    <circle cx="240" cy="32" r="4" fill="#CBD5E1"/>
    <circle cx="350" cy="32" r="4" fill="#CBD5E1"/>
    <text x="368" y="36" class="mono-label">large · rerank · topK 10</text>

    <!-- Branch 2: large · rerank · topK 2 -->
    <path d="M 20 112 L 120 72 L 250 72 L 350 72" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <circle cx="120" cy="72" r="4" fill="#CBD5E1"/>
    <circle cx="250" cy="72" r="4" fill="#CBD5E1"/>
    <circle cx="350" cy="72" r="4" fill="#CBD5E1"/>
    <text x="368" y="76" class="mono-label">large · rerank · topK 2</text>

    <!-- Branch 3: THE CHOSEN PATH (small · topK 2) -->
    <path d="M 20 112 L 350 112" stroke="#0D9488" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="130" cy="112" r="5" fill="#0D9488"/>
    <circle cx="250" cy="112" r="5" fill="#0D9488"/>
    <circle cx="350" cy="112" r="13" stroke="#0D9488" stroke-width="3" fill="none"/>
    <circle cx="350" cy="112" r="6" fill="#0D9488"/>
    <!-- Active Pill Badge -->
    <rect x="368" y="98" width="138" height="28" rx="4" fill="rgba(13, 148, 136, 0.1)" stroke="rgba(13, 148, 136, 0.3)" stroke-width="1"/>
    <text x="378" y="117" class="mono-active">small · topK 2</text>

    <!-- Branch 4: medium · topK 2 -->
    <path d="M 20 112 L 120 152 L 250 152 L 350 152" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <circle cx="120" cy="152" r="4" fill="#CBD5E1"/>
    <circle cx="250" cy="152" r="4" fill="#CBD5E1"/>
    <circle cx="350" cy="152" r="4" fill="#CBD5E1"/>
    <text x="368" y="156" class="mono-label">medium · topK 2</text>

    <!-- Branch 5: large · topK 2 -->
    <path d="M 20 112 L 100 192 L 240 192 L 350 192" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <circle cx="100" cy="192" r="4" fill="#CBD5E1"/>
    <circle cx="240" cy="192" r="4" fill="#CBD5E1"/>
    <circle cx="350" cy="192" r="4" fill="#CBD5E1"/>
    <text x="368" y="196" class="mono-label">large · topK 2</text>

    <!-- Start Node -->
    <circle cx="20" cy="112" r="8" fill="#0B1220"/>
  </g>
</svg>