<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      .banner-title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 42px; letter-spacing: -0.02em; fill: #0B1220; }
      .banner-tagline { font-family: 'Inter', -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #64748B; }
      .mono-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #64748B; }
      .mono-active { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; fill: #0D9488; }
    </style>
    <pattern id="grid-light" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#E2E8F0" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="#F7F8FA"/>
  <rect width="1280" height="320" fill="url(#grid-light)"/>

  <!-- Left Side: Brand & Tagline -->
  <g transform="translate(64, 96)">
    <!-- Small Mark inline -->
    <g transform="translate(0, 0) scale(0.12)">
      <circle cx="88" cy="256" r="32" fill="#0B1220"/>
      <path d="M 88 256 L 424 256" stroke="#0D9488" stroke-width="24"/>
      <circle cx="424" cy="256" r="44" stroke="#0D9488" stroke-width="16" fill="none"/>
      <circle cx="424" cy="256" r="20" fill="#0D9488"/>
      <path d="M 88 256 L 180 140 L 424 140" stroke="#CBD5E1" stroke-width="12"/>
      <path d="M 88 256 L 180 372 L 424 372" stroke="#CBD5E1" stroke-width="12"/>
    </g>
    <text x="68" y="44" class="banner-title">pathwise</text>
    <text x="2" y="88" class="banner-tagline">The cheapest path to the answer.</text>
  </g>

  <!-- Right Side: Detailed Graph (8 branches, 1 chosen teal route) -->
  <g transform="translate(680, 40)">
    <!-- Branch A (top expensive) -->
    <path d="M 40 120 L 140 40 L 320 40 L 480 30" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <circle cx="140" cy="40" r="4" fill="#CBD5E1"/>
    <circle cx="320" cy="40" r="4" fill="#CBD5E1"/>
    <circle cx="480" cy="30" r="4" fill="#CBD5E1"/>
    <text x="495" y="34" class="mono-label">large · rerank ($0.042)</text>

    <!-- Branch B -->
    <path d="M 40 120 L 160 70 L 340 70 L 480 70" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <circle cx="160" cy="70" r="4" fill="#CBD5E1"/>
    <circle cx="340" cy="70" r="4" fill="#CBD5E1"/>
    <circle cx="480" cy="70" r="4" fill="#CBD5E1"/>
    <text x="495" y="74" class="mono-label">large · topK 5 ($0.033)</text>

    <!-- Branch C -->
    <path d="M 40 120 L 180 100 L 330 100 L 480 100" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <circle cx="180" cy="100" r="4" fill="#CBD5E1"/>
    <circle cx="330" cy="100" r="4" fill="#CBD5E1"/>
    <circle cx="480" cy="100" r="4" fill="#CBD5E1"/>
    <text x="495" y="104" class="mono-label">medium · rerank</text>

    <!-- Branch D (THE CHOSEN PATH) -->
    <path d="M 40 120 L 480 120" stroke="#0D9488" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="180" cy="120" r="5" fill="#0D9488"/>
    <circle cx="340" cy="120" r="5" fill="#0D9488"/>
    <circle cx="480" cy="120" r="14" stroke="#0D9488" stroke-width="3" fill="none"/>
    <circle cx="480" cy="120" r="6" fill="#0D9488"/>
    <!-- Active Pill Badge -->
    <rect x="502" y="106" width="170" height="26" rx="4" fill="rgba(13, 148, 136, 0.1)" stroke="rgba(13, 148, 136, 0.25)" stroke-width="1"/>
    <text x="512" y="123" class="mono-active">small · topK 2 ($0.0049)</text>

    <!-- Branch E -->
    <path d="M 40 120 L 180 145 L 330 145 L 480 145" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <circle cx="180" cy="145" r="4" fill="#CBD5E1"/>
    <circle cx="330" cy="145" r="4" fill="#CBD5E1"/>
    <circle cx="480" cy="145" r="4" fill="#CBD5E1"/>
    <text x="495" y="149" class="mono-label">medium · topK 2</text>

    <!-- Branch F -->
    <path d="M 40 120 L 160 175 L 340 175 L 480 175" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <circle cx="160" cy="175" r="4" fill="#CBD5E1"/>
    <circle cx="340" cy="175" r="4" fill="#CBD5E1"/>
    <circle cx="480" cy="175" r="4" fill="#CBD5E1"/>
    <text x="495" y="179" class="mono-label">small · topK 5</text>

    <!-- Branch G (bottom) -->
    <path d="M 40 120 L 140 210 L 320 210 L 480 210" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
    <circle cx="140" cy="210" r="4" fill="#CBD5E1"/>
    <circle cx="320" cy="210" r="4" fill="#CBD5E1"/>
    <circle cx="480" cy="210" r="4" fill="#CBD5E1"/>
    <text x="495" y="214" class="mono-label">small · no-retrieval</text>

    <!-- Start Node -->
    <circle cx="40" cy="120" r="9" fill="#0B1220"/>
  </g>
</svg>